# Suppresses all HikariCP log output (SLF4J logger "com.zaxxer.hikari" and its
# sub-loggers, e.g. com.zaxxer.hikari.pool.PoolBase / HikariPool). Since this
# module ships slf4j-simple as its SLF4J binding, this file is the one that
# actually controls it unless a consumer excludes slf4j-simple in favor of
# their own binding (Logback/Log4j2), in which case the equivalent needs to be
# configured there instead.
org.slf4j.simpleLogger.log.com.zaxxer.hikari=off

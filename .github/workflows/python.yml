# CI for the Python mirror under python/. Runs only when Python sources change, the
# counterpart of maven.yml ignoring python/** - so a commit touching one edition never
# builds the other.
name: Python CI

on:
  push:
    branches: [ "master" ]
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]
        package: [ database-driver-api, database-driver-plugin ]
    defaults:
      run:
        working-directory: python/${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The plugin depends on the api package; installing the sibling from the same
      # checkout keeps the two testable against each other's current state.
      - name: Install sibling api package (plugin only)
        if: matrix.package == 'database-driver-plugin'
        run: pip install -e ../database-driver-api

      - name: Install
        run: pip install -e .[dev]

      - name: Lint
        run: ruff check src tests

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest -q
